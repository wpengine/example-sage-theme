# Server and project configuration
# Note: SONAR_HOST_URL secret in the workflow takes precedence at scan time.
# This entry documents the expected host and is a no-op when the secret is set.
sonar.host.url=https://sonar.wpengine.io/
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Project identifiers
sonar.projectName=example-sage-theme
sonar.projectKey=wpengine_example-sage-theme_c16e3095-fcf4-41b8-b8b7-d60c822888f4

# Paths to source code directories (relative paths)
sonar.sources=wp-content

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,docs/**

# Paths to test code directories (relative paths)
sonar.tests=wp-content
sonar.test.inclusions=**/*Test.php,**/*.test.js,**/*.test.ts
